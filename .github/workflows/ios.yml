name: iPhone (compilation de contrôle)

# Compile l'application iPhone pour le SIMULATEUR sur un exécuteur macOS (Xcode n'existe pas sous Windows). Aucun compte Apple Developer n'est nécessaire :
# pas de signature, pas de publication. Le dépôt étant public, les minutes macOS de GitHub sont gratuites.
# Pour envoyer sur TestFlight ou l'App Store il faudra, plus tard, un compte Apple Developer (voir docs/NATIF-PLAN.md).
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulateur:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Valeurs PUBLIQUES du site (adresse Supabase, clé publique), si elles sont définies comme « variables » du dépôt. Sans elles, l'application se compile quand même
      # (elle dira qu'elle n'est pas configurée) : l'objet de ce contrôle est que le code iPhone compile et se lie.
      - name: Réglages publics (facultatifs)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$(printf '%s' "$SUPABASE_URL" | sed 's#//#/$()/#')" "$SUPABASE_ANON_KEY" > mobile/iosApp/Configuration/Secrets.xcconfig
            echo "Réglages publics écrits."
          else
            echo "Aucun réglage public défini : compilation sans configuration."
          fi

      # Compose Multiplatform référence des classes UIKit récentes (UIViewLayoutRegion) : il faut le SDK d'un Xcode 26. L'image macOS en propose plusieurs ; on prend le plus récent.
      - name: Choisir Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; else echo "Aucun Xcode 26 sur cette image : on garde celui par défaut."; fi
          xcodebuild -version

      - name: Compiler pour le simulateur iPhone
        working-directory: mobile/iosApp
        run: |
          set +e
          xcodebuild \
            -project iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          statut=$?
          tail -n 40 "$RUNNER_TEMP/xcodebuild.log"
          if [ "$statut" -ne 0 ]; then
            # Les journaux ne se lisent qu'une fois connecté à GitHub : les erreurs sont aussi publiées comme annotations, visibles de tous.
            grep -vE "^[[:space:]]+(export|setenv|write-file|cd|builtin|/Applications|/usr|/bin) " "$RUNNER_TEMP/xcodebuild.log" | grep -vE "^(WriteAuxiliaryFile|MkDir|ProcessInfoPlistFile|CpResource|Create)" | tail -n 70 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/message.txt"
            echo "::error title=Fin du journal Xcode::$(cat $RUNNER_TEMP/message.txt)"
          fi
          exit $statut

      # Lance l'application dans le simulateur iPhone de l'exécuteur et prend des captures (le contrôle de compilation ci-dessus reste le juge : cette étape est un bonus).
      # simctl ne sait pas toucher l'écran : on voit donc les écrans qui s'affichent seuls (ouverture, choix du profil, visite guidée).
      - name: Lancer dans le simulateur et prendre des captures
        continue-on-error: true
        run: |
          mkdir -p captures
          APP=$(ls -d mobile/iosApp/build/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl list devices available | grep -i iphone | head -8
          UDID=$(xcrun simctl list devices available | grep -i "iPhone" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.speedfood.app
          for n in 1 2 3 4 5 6; do
            sleep 8
            xcrun simctl io "$UDID" screenshot "captures/0${n}-apres-$((n*8))s.png"
          done
          ls -l captures

      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-iphone
          path: captures/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Conserver l'application compilée
        uses: actions/upload-artifact@v4
        with:
          name: speedfood-simulateur-iphone
          path: mobile/iosApp/build/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 14
