name: Android Expo (candidat de remplacement, NON publié)

# Prépare le CANDIDAT de la NOUVELLE appli Speedfood (com.speedfood.mobile) : identité de production, code supérieur au dernier code de l'ancienne appli Kotlin, cible Android 37.
# Elle s'installe À CÔTÉ de l'ancienne (com.speedfood.app, dont la clé est perdue) : plan docs/plans/2026-11-11-nouvelle-identite-android.md.
# Il n'est PAS signé avec la clé de production (elle reste chez Malika, jamais dans GitHub) : l'APK sortie est signée avec la clé de DEBUG du modèle Expo.
# Elle ne doit JAMAIS être publiée telle quelle. Procédure : signature par Malika (docs/SIGNATURE-CANDIDAT-EXPO.md), contrôle, essai sur appareil.
# Ne se déclenche que sur une branche « candidat-* » (jamais sur etape-* ni master) ; valeurs lues dans apps/mobile/candidat-android.json.
on:
  push:
    branches: ["candidat-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-candidat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      SPEEDFOOD_IDENTITE: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire le code et la version du candidat
        run: |
          echo "SPEEDFOOD_CODE=$(node -p "require('./apps/mobile/candidat-android.json').code")" >> "$GITHUB_ENV"
          echo "SPEEDFOOD_VERSION=$(node -p "require('./apps/mobile/candidat-android.json').version")" >> "$GITHUB_ENV"

      - name: Installer les paquets
        run: npm ci

      - name: Tests mobiles
        working-directory: apps/mobile
        run: npm test

      # Cible Android 37 (celle de l'APK actuelle) : le contrôle de remplacement refuse tout recul. La plate-forme 37 est installée si elle manque.
      - name: Installer la plate-forme Android 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --list 2>/dev/null | grep -i "platforms;android-37" || true
          PAQUET=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[.0-9a-z-]*' | sort -u | head -1)
          test -n "$PAQUET" || { echo "Aucune plate-forme Android 37 dans le catalogue"; exit 1; }
          echo "Installation de $PAQUET"
          "$SDKM" "$PAQUET"

      # Configuration Firebase (notifications) : fichier ignoré par Git, fourni par le secret GOOGLE_SERVICES_JSON_B64 (posé par Malika).
      # Sans ce fichier, la compilation reste verte mais l'appli n'a AUCUNE notification (« Default FirebaseApp failed to initialize » constaté à l'émulateur le 12 novembre 2026).
      - name: Poser la configuration Firebase
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > apps/mobile/google-services.json
            echo "Configuration Firebase posee."
          else
            echo "Secret GOOGLE_SERVICES_JSON_B64 absent : le candidat n'aurait pas de notifications."
            exit 1
          fi

      - name: Générer le projet natif Android (identité de production)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Architectures de TÉLÉPHONE seulement (décision du 12 novembre 2026) : arm64-v8a (récents) et armeabi-v7a (32 bits, beaucoup d'entrée de gamme), comme l'ancienne appli.
      # x86 et x86_64 ne servent qu'aux émulateurs : l'essai sur émulateur se fait avec le workflow « Android Expo (compilation de contrôle) ».
      - name: Compiler le candidat (release, arm64 et 32 bits)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.compileSdkVersion=37 -Pandroid.targetSdkVersion=37

      - name: Contrôler l'identité du candidat
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" | tee badging.txt
          grep -q "name='com.speedfood.mobile' versionCode='${SPEEDFOOD_CODE}'" badging.txt
          grep -q "targetSdkVersion:'37'" badging.txt
          # Les deux architectures de téléphone sont présentes, celles d'émulateur absentes (sinon l'APK publique pèserait plus lourd pour rien).
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/' || { echo "arm64-v8a manquante"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/' || { echo "armeabi-v7a (32 bits) manquante"; exit 1; }
          if unzip -l "$APK" | grep -qE 'lib/x86(_64)?/'; then echo "bibliothèques x86/x86_64 présentes : inutile pour un téléphone"; exit 1; fi
          unzip -l "$APK" | grep -E 'lib/[a-z0-9_-]+/' | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c
          sha256sum "$APK"; ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: candidat-android-NON-SIGNE-PRODUCTION
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
