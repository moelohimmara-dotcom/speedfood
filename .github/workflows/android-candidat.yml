name: Android Expo (candidat de remplacement, NON publié)

# Prépare le CANDIDAT qui remplacerait l'APK Kotlin (com.speedfood.app) : identité de production, code supérieur au code publié, cible Android 37.
# Il n'est PAS signé avec la clé de production (elle reste chez Malika, jamais dans GitHub) : l'APK sortie est signée avec la clé de DEBUG du modèle Expo.
# Elle ne doit JAMAIS être publiée telle quelle. Procédure : docs/plans/2026-11-01-remplacement-apk-expo.md (signature par Malika, contrôle, essai sur appareil).
# Ne se déclenche que sur une branche « candidat-* » (jamais sur etape-* ni master) ; valeurs lues dans apps/mobile/candidat-android.json.
on:
  push:
    branches: ["candidat-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-candidat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      SPEEDFOOD_IDENTITE: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lire le code et la version du candidat
        run: |
          echo "SPEEDFOOD_CODE=$(node -p "require('./apps/mobile/candidat-android.json').code")" >> "$GITHUB_ENV"
          echo "SPEEDFOOD_VERSION=$(node -p "require('./apps/mobile/candidat-android.json').version")" >> "$GITHUB_ENV"

      - name: Installer les paquets
        run: npm ci

      - name: Tests mobiles
        working-directory: apps/mobile
        run: npm test

      # Cible Android 37 (celle de l'APK actuelle) : le contrôle de remplacement refuse tout recul. La plate-forme 37 est installée si elle manque.
      - name: Installer la plate-forme Android 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Générer le projet natif Android (identité de production)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Compiler le candidat (release, arm64 et x86_64)
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 -Pandroid.compileSdkVersion=37 -Pandroid.targetSdkVersion=37

      - name: Contrôler l'identité du candidat
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" | tee badging.txt
          grep -q "name='com.speedfood.app' versionCode='${SPEEDFOOD_CODE}'" badging.txt
          grep -q "targetSdkVersion:'37'" badging.txt
          sha256sum "$APK"; ls -l "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: candidat-android-NON-SIGNE-PRODUCTION
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
