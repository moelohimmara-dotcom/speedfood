<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b82a20">
<title>Hors connexion · Speedfood</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #fff6ed; color: #2a1a14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
  main { width: 100%; max-width: 26rem; text-align: center; display: grid; gap: 16px; justify-items: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; }
  p { margin: 0; color: #5a4a40; }
  button { appearance: none; border: 0; border-radius: 999px; padding: 14px 28px; min-height: 48px; background: #b82a20; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #2a1a14; outline-offset: 3px; }
  .etat { font-size: .9rem; color: #75695f; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>Pas de connexion pour le moment</h1>
  <p>Speedfood a besoin d&rsquo;internet pour afficher les restaurants et envoyer votre commande. Vérifiez vos données mobiles ou le Wi-Fi.</p>
  <button type="button" id="reessayer">Réessayer</button>
  <p class="etat" id="etat" role="status">Dès que le réseau revient, cette page se recharge d&rsquo;elle-même.</p>
</main>
<script>
  var etat = document.getElementById("etat");
  document.getElementById("reessayer").addEventListener("click", function () {
    etat.textContent = "Nouvelle tentative…";
    location.reload();
  });
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
